spring.application.name=ApiGateway

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apidb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET:}

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
#razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

platform.commission-rate=${PLATFORM_COMMISSION_RATE:0.10}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
